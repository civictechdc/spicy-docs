[project]
name = "spicy-docs"
version = "0.53.0"
description = "Faithful acquisition from government sources and immutable source-native release publication"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rulespec-artifacts==1.1.2",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
# Live HTTP/S3 acquisition and raw readers. Injected fetchers and the core
# reader, evidence access, and JSON/HTML parsers do not require these packages.
acquisition = ["boto3", "httpx", "loguru", "tqdm"]
# Captured comment Parquet parsing/full replay and flat-table publication.
public-table = ["polars", "pyarrow"]
# A full pass over a retained CourtListener export: bzip2 decompressed on every core
# (bulk.py), and record-aligned pieces parsed by DuckDB in parallel into Arrow (local.py).
courtlistener-local = ["duckdb>=1.5.5,<2", "indexed-bzip2>=1.7,<2", "pyarrow"]
# Retained publisher HTML whose source fields lack a structured representation.
html = ["beautifulsoup4==4.14.3"]
# Retained community YAML metadata, with literal dates and bounded parsing.
yaml = ["PyYAML>=6,<7"]
# PDF/image decoding is shared; select recognition providers separately.
pdf = ["pymupdf>=1.28,<2", "pillow>=12,<13"]
# Raw page text for consumers that use pypdf's extraction behavior.
pdf-pypdf = ["pypdf>=6,<7"]
pdf-rapidocr = ["rapidocr-onnxruntime>=1.4.4,<2"]
pdf-apple = ["ocrmac>=1.0.1,<2; sys_platform == 'darwin'"]
pdf-mlx = ["mlx-vlm==0.7.0; sys_platform == 'darwin' and platform_machine == 'arm64'"]
pdf-gemini = ["httpx>=0.28,<1"]
# Structural bill-XML diffing, by the sibling Civic Tech DC engine rather than a
# copy of it. `sources/congress/bill_tree.py` and `interpretation/section_diff.py`
# are adapters over it and import nothing when the extra is absent.
bill-diff = ["deltatrack==0.1.0"]
# Congressional Record speech turns, by the @unitedstates parser rather than a
# copy of it. `sources/congress/record_speeches.py` is the adapter over it and
# imports nothing when the extra is absent. beautifulsoup4 is the parser's own
# reader, pinned as the html extra pins it so a host resolves the version the
# gate tests rather than the newest.
record-speeches = ["congressionalrecord==2.3.0", "beautifulsoup4==4.14.3"]
# Schema validation of reconstructed XML against a profile's pinned DTD or XSD
# bundle. `reconstruction/validate.py` is the only importer and imports it at
# call time; the rest of `reconstruction/` is stdlib and needs no extra.
reconstruct = ["lxml>=6,<7"]

[dependency-groups]
dev = [
    # Optional canonical-JSON accelerator; Rulespec falls back to json.dumps.
    # Consumers install it directly because the artifacts wheel has no extra.
    "msgspec>=0.18,<1",
    # Tests verify direct Parquet reads with DuckDB; at runtime only the
    # courtlistener-local extra uses it.
    "duckdb",
    "pytest",
    "ruff",
    "ty",
]

[project.scripts]
spicy-docs-source-native = "spicy_docs.cli.source_native:main"
spicy-docs-fec = "spicy_docs.cli.fec:main"
spicy-docs-list = "spicy_docs.cli.list_pages:main"

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
rulespec-artifacts = { path = "vendor/rulespec_artifacts-1.1.2-py3-none-any.whl" }
# A git pin, not a PyPI range, because DeltaTrack publishes nothing to PyPI yet:
# the project became installable only recently and `deltatrack` is an unclaimed
# name on the index, so a version specifier alone would resolve to nothing at
# best and to somebody else's package at worst. The revision is a full commit
# sha rather than a branch or tag so the resolved tree is the one that was
# measured; `docs/sources/congress-bill-tree.md` records what was measured
# against it and what is still open upstream. Move the pin when upstream
# publishes a release, and drop this source entirely at that point.
deltatrack = { git = "https://github.com/civictechdc/DeltaTrack", rev = "c636448ba08d55bba7cb8c884aad0f5ac1ccf2f6" }
# A git pin on a fork, not a PyPI range, for two measured reasons (2026-09-28).
# Nothing is published under `congressionalrecord` (the simple index answers
# 404), so a version specifier alone would resolve to nothing at best and to
# somebody else's package at worst. And a wheel built from upstream main
# (`84a5af4`) ships only the top-level package: `congressionalrecord.govinfo`,
# the parser the adapter imports, is not in it. The fork's `spicy-docs-pin`
# branch carries the changes offered upstream in unitedstates/congressional-record
# #92 (package discovery, a speaker line indented up to three spaces, and
# `parse_status`/`parse_error` so a partial parse is not reported as complete),
# #93 (the dependencies the non-PostgreSQL modules import, with the PostgreSQL
# writer's behind a `postgres` extra this repository does not install) and #94
# (per-document `item_types`, real `None` for absent values, `CRParseError` for
# a header cut short or astray, an accessId index read once per MODS, and the
# prose after a `[[Page]]` marker that opens a line kept as text), with
# #90's speaker pattern (jutton1:fix-text-mislabeling) merged in; plus two
# fork-only commits, one pinning the build backend so a vendored wheel is
# reproducible and one pruning the tests from the sdist. The revision is a
# full commit sha so the resolved tree is the one tested. When upstream merges
# them and publishes a release, drop this source and pin it;
# `docs/sources/congressional-record-speeches.md` says how.
congressionalrecord = { git = "https://github.com/mikewolfd/congressional-record", rev = "ee5ba237b7db90bbf8a8fa438f2eb68a0077d973" }

[tool.pytest.ini_options]
# Default checks stay offline. Opt in to live services or httpfs explicitly.
addopts = "-m 'not integration and not httpfs'"
testpaths = ["tests"]
markers = [
    "integration: live test against external data; not run by default",
    # Local httpfs tests can stall in a C call for ~120s; Python's signal
    # timeout cannot interrupt it. Run explicitly with -m httpfs.
    "httpfs: DuckDB httpfs range reads; stalls in this environment, not run by default",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [
    ".venv",
    # Agent worktrees are whole sibling checkouts; the gate must not read them.
    ".claude/worktrees",
]
