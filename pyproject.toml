[project]
name = "spicy-docs"
version = "0.2.0"
description = "Faithful acquisition from government sources and immutable source-native release publication"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rulespec-artifacts==1.0.11",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
# Live HTTP/S3 acquisition and raw readers. Injected fetchers and the core
# reader, evidence access, and JSON/HTML parsers do not require these packages.
acquisition = ["boto3", "httpx", "loguru", "tqdm"]
# Captured comment Parquet parsing/full replay and flat-table publication.
public-table = ["polars", "pyarrow"]

[dependency-groups]
dev = [
    # Optional accelerator for rulespec-artifacts' canonical encoder, which
    # imports it defensively and falls back to json.dumps when it is absent.
    # The artifacts wheel declares no extra for it, so a consumer that wants
    # the acceleration installs it directly.
    "msgspec>=0.18,<1",
    # test_public_table.py proves the public-table module docstring's claim
    # that DuckDB reads the declared Parquet members directly; the module
    # itself never imports duckdb, so it stays test-only rather than runtime.
    "duckdb",
    "pytest",
    "ruff",
    "ty",
]

[project.scripts]
spicy-docs-source-native = "spicy_docs.cli.source_native:main"

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
rulespec-artifacts = { path = "vendor/rulespec_artifacts-1.0.11-py3-none-any.whl" }

[tool.pytest.ini_options]
# Integration tests hit external services (the public Mirrulations S3 mirror,
# federalregister.gov) and are excluded from the default run so the unit suite
# stays hermetic.
addopts = "-m 'not integration and not httpfs'"
testpaths = ["tests"]
markers = [
    "integration: live test against external data; not run by default",
    # DuckDB's httpfs client stalls against a local ThreadingHTTPServer when
    # the server and query run inside a function scope; an equivalent
    # top-level script with the same request/response pattern finishes in
    # milliseconds. The in-test timeout cannot cut it short -- the stall is
    # inside a C call that never yields to Python's signal handler, so the
    # alarm is only delivered when DuckDB's own ~120s timeout returns. Kept,
    # unmodified, and deselected by default so one environment quirk does not
    # add two minutes to every run. Run it with -m httpfs.
    "httpfs: DuckDB httpfs range reads; stalls in this environment, not run by default",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [
    ".venv",
]
