# Weekly live-publisher check (E4). This is a report, not a gate: it runs only on its own
# schedule (never on pull_request or push), so it must never be added as a required status
# check in branch protection -- that is what keeps the default `Checks` workflow (checks.yml)
# green or red on the repository's own code, not on a publisher's day-to-day drift. A failing
# run here means a pinned live fixture no longer matches what the publisher answers today; open
# an issue from the junit report instead of blocking a pull request.
name: Live

on:
  schedule:
    - cron: '13 8 * * 1' # weekly, Monday 08:13 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.21'
          python-version: '3.12'
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-extras
      - name: Write the api.data.gov credential
        # Header-only at request time (spicy_docs.transport.credentials); this file only ever
        # exists on the ephemeral runner and is never logged, committed or uploaded.
        run: |
          printf 'API_GOV=%s\n' "${{ secrets.API_GOV }}" > .env
          chmod 600 .env
      - name: Run the live integration tests
        env:
          SPICY_DOCS_ENV_FILE: ${{ github.workspace }}/.env
        run: uv run --frozen pytest -q -m integration --junitxml=junit-live.xml
      - name: Upload the junit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-junit
          path: junit-live.xml
          retention-days: 90
